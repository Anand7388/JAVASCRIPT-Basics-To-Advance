<!DOCTYPE html>

<body>
<h1>JavaScript Arithmetic</h1>
<p>A typical arithmetic operation takes two numbers (or variables) and produces a new number.</p>

<p id="anand yadav"></p>

<script>
let a = 100;
let b = 50;
let x = a + b;
document.getElementById("anand yadav").innerHTML = x;
</script>
