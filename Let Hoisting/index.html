<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let Hoisting</title>
</head>
<body>
    <h1>JavaScript Hoisting</h1>

    <p>With <b>var</b>, you can use a variable before it is declared:</p>

    <p id="anand yadav"></p>

   <script>
   carName = "Volvo";
   document.getElementById("anand yadav").innerHTML = carName;
   var carName;
   </script>

</body>
</html>
