<!DOCTYPE html>
<html lang="en">
<head>

    <title>The Boolean() Function</title>

<body>
<h1>JavaScript Booleans</h1>

<p id="file"></p>

<script>
document.getElementById("file").innerHTML = Boolean(10 > 9);
</script>
