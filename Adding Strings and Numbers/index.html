<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adding Strings and Numbers</title>
</head>
<body>
    
<h1>JavaScript String Operators</h1>
<h2>The + Operator</h2>
<p>Adding a number and a string, returns a string.</p>

<p id="anand yadav"></p>

<script>
let x = 5 + 5;
let y = "5" + 5;
let z = "anand yadav" + 5;
document.getElementById("anand yadav").innerHTML =
x + "<br>" + y + "<br>" + z;
</script>
</body>
</html>
