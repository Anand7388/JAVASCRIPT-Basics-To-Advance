<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cannot be Reassigned</title>
</head>
<body>
    <h2>JavaScript const</h2>

    <p id="anand yadav"></p>

    <script>
    try {
       const PI = 3.141592653589793;
       PI = 3.14;
    }
    catch (err) {
      document.getElementById("anand yadav").innerHTML = err;
   }
   </script>

</body>
</html>
