<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comments to Prevent Execution</title>
</head>
<body>
    <h2>JavaScript Comments</h2>

    <h1 id="anand"></h1>

    <p id="ankit"></p>

    <script>
     //document.getElementById("anand").innerHTML = "My First Page";
    document.getElementById("ankit").innerHTML = "My first paragraph.";
    </script>

    <p>The line starting with // is not executed.</p>

</body>
</html>
