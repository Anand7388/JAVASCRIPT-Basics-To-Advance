<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript String Addition</title>
</head>
<body>
    
<h1>JavaScript String Operators</h1>
<h2>The + Operator</h2>
<p>The + operator concatenates (adds) strings.</p>

<p id="anand yadav"></p>

<script>
let text1 = "anand";
let text2 = "yadav";
let text3 = text1 + " " + text2;
document.getElementById("anand yadav").innerHTML = text3;
</script>

</body>
</html>
