<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>break & continue</title>
</head>
<body>
    <h1>break & continue </h1>
    <p>The <code>break </code> statement is used to exit a loop prematurely, while the <code>continue </code> statement is used to skip the current iteration and move to the next one.</p>

    <script>
        // Example of break statement
       for (let i = 0; i < 10; i++) {
           console.log ();
           if (i === 5) {
            break;   // Exit the loop when i is 5
           }
           console.log(i);  
       }

        // or 

        let arr = [1, 3, 5, 6, 7, 8, 3, 4];
        for (let i = 0; i < arr.length; i++) {
            if (arr[i] === 6) {
                console.log(`number found at index ${i}`);
                break;  // Exit the loop when the number is found 
            }
            console.log(arr[i]);  // this will print the numbers untill it finds 6 
        }



        // Example of continue statement 

        for (let i = 0; i < 10; i++) {
            if (i % 2 ===0) {
                continue;   // skip the current iteration when i is even 
            }
            console.log(i);  // this will print only odd numbers from 0 to 9 
        }

        
    
    

    </script>
</body>
</html>
