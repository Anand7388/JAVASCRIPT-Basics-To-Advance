<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>break & continue</title>
</head>
<body>
    <h1>break & continue </h1>
    <p>The <code>break </code> statement is used to exit a loop prematurely, while the <code>continue </code> statement is used to skip the current iteration and move to the next one.</p>

    <script>
        // Example of break statement
        for (let i = 0; i < 10; i++) {
            console.log(i);
            if (i === 5) {
                break; // exits the loop when i is 5
            }
            console.log("this wil not be printed when i is 5");
        }

        // or

        let arr = [1, 3, 5, 6, 7, 8, 3, 4];
        for (let i = 0; i <arr.length; i++) {
            if (arr[i] === 8) {
                console.log(` Number found at index ${i}`);
                break;  // exits the loop when the number 8 is found
                
            }
            console.log('still looking');

        }

        
    
    

    </script>
</body>
</html>
