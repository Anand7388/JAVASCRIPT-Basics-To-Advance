<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incrementing</title>
</head>
<body>
<h1>JavaScript Arithmetic</h1>
<h2>The ++ incrementing  Operator</h2>

<p id="anand yadav"></p>

<script>
let x = 50;
x++;
let z = x;
document.getElementById("anand yadav").innerHTML = z;
</script>
</body>
</html>
