<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditions</title>
</head>
<body>
<h1>JavaScript Boolean</h1>
<h2>Use Case: if .. else</h2>

<p id="anand yadav"></p>

<script>
const hour = new Date().getHours(); 
let greeting;

if (hour < 18) {
  greeting = "Good day!";
} else {
  greeting = "Good evening!";
}

document.getElementById("anand yadav").innerHTML = greeting;
</script>
</body>
</html>
