<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constant Arrays</title>
</head>
<body>
    <h1>JavaScript const</h1>

    <p>Declaring a constant array does NOT make the elements unchangeable:</p>

    <p id="anand yadav"></p>

    <script>
     // Create an Array:
    const cars = ["Saab", "Volvo", "BMW"];

    // Change an element:
    cars[0] = "Toyota";

    // Add an element:
    cars.push("Audi");

    // Display the Array:
    document.getElementById("anand yadav").innerHTML = cars; 
    </script>
</body>
</html>
