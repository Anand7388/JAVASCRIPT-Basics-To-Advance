<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Methods</title>
</head>
<body>
    <h1>Array Methods</h1>
    <p>This is a simple example of array methods.</p>
    <button id="my-button">Click me!</button>
    <script>
        let arr = [1, 2, 3, 4, 5, 6, 7, 8, 9];
        let odds = arr.filter((num, index) => {
            if (num % 2 !== 1) {
                return false;

            }
            else {
                return true;
            }
        });
        console.log(odds);
    </script>

    
</body>
</html>
