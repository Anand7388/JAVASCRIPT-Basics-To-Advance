<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow functions</title>
</head>
<body>
    <h1>Arrow functions </h1>
    <p>Arrow functions are a concise way to write function expressions in JavaScript.</p>
    <script>
        // Traditional function expression 
        let sum = function(num1, num2) {
            return num1 + num2;
        }
        // Arrow function expression
        let sumArrow = (num1, num2) => {
            return num1 + num2;
        }
        // Arrow function with implicit return ( for single expression)
        let sumArrowImplicit = (num1, num2) => num1 + num2;
        console.log(sum(5, 10)); // output: 15
        console.log(sumArrow(5, 10)); // output: 15
        console.log(sumArrowImplicit())
    </script>
    
</body>
</html>
