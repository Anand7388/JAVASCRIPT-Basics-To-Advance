<h1>JavaScript if</h1>

<p id="anand yadav"></p>

<script>
let age = 16;
let text = "You can Not drive!";

if (age >= 18) {
  text = "You can drive!";
}

document.getElementById("anand yadav").innerHTML = text;
</script>
</body>
