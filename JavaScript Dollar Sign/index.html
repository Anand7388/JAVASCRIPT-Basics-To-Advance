<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Dollar Sign</title>
</head>
<body>
    <h1>JavaScript Variables</h1>

<p>The dollar sign is treated as a letter in JavaScript names.</p>

<p id="anand"></p>

<script>
let $$$ = 2;
let $myMoney = 5;

document.getElementById("anand").innerHTML = $$$ + $myMoney;
</script>
</body>
</html>
