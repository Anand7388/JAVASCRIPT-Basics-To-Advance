<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Scope</title>
</head>
<body>
    <h2>JavaScript const variables has block scope</h2>

    <p id="anand yadav"></p>

    <script>
    const  x = 30;
    // Here x is 10

   {  
   const x = 2;
   // Here x is 2
   }

   // Here x is 10
   document.getElementById("anand yadav").innerHTML = "x is " + x;
   </script>
</body>
</html>
