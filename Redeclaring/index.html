<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redeclaring</title>
</head>
<body>
    <script>
        // Global var
        var x = 2;     // Allowed
        console.log('x =', x);
        document.body.insertAdjacentHTML('beforeend', '<p>x = ' + x + '</p>');

        // First block: let/const are block-scoped, log inside block
        {
            let y = 2;     // Allowed: new block scope
            const z = 2;   // Allowed: new block scope
            console.log('y =', y, 'z =', z);
            document.body.insertAdjacentHTML('beforeend', '<p>y = ' + y + ', z = ' + z + '</p>');
        }

        // Second block: const a in its own block
        {
            const a = 2;   // Allowed: new block scope
            console.log('a =', a);
            document.body.insertAdjacentHTML('beforeend', '<p>a = ' + a + '</p>');
        }
    </script>
</body>
</html>
