<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The While Loop</title>
</head>
<body>
<h1>JavaScript Loops</h1>
<h2>The While Loop</h2>

<p id="anand yadav"></p>

<script>
let text = "";

let i = 0;
while (i < 10) {
  text += "The number is " + i + "<br>";
  i++;
}

document.getElementById("anand yadav").innerHTML = text;
</script>
</body>
</body>
</html>
