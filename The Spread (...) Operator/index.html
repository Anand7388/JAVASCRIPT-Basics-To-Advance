<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h1>The Spread Operator</h1>
<h2>The ... Operator</h2>

<p id="anand yadav"></p>

<script>
let text = "12345";
let min = Math.min(...text);
let max = Math.max(...text);

document.getElementById("anand yadav").innerHTML =
"Minimum is: " + min + "<br>Maximum is: " + max;
</script>
</body>
</html>
