<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The += Operator</title>
</head>
<body>
<h1>JavaScript Assignments</h1>
<h2>Addition Assignment</h2>
<h3>The += Operator</h3>

<p>The value of x is:</p>
<p id="anand yadav"></p>

<script>
let x = 10;
x += 50; // x = x + 50 
document.getElementById("anand yadav").innerHTML = x;
</script>
</body>
</html>
