<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strict Comparison</title>
</head>
<body>
<h1>JavaScript switch Control</h1>
<h3>strict comparison (===).</h3>


<p id="anand yadav"></p>

<script>
let x = "0";

switch (x) {
  case 0:
    text = "Off";
    break;
  case 1:
    text = "On";
    break;
  default:
    text = "No value found";
}
document.getElementById("anand yadav").innerHTML = text;
</script>
</body>
</html>
