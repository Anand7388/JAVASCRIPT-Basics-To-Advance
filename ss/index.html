<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript if Statement</title>
</head>
<body>
<h1>JavaScript if</h1>

<p>Display "Good day!" if the hour is less than 18:00:</p>

<p id="anand yadav">Good Evening!</p>

<script>
if (new Date().getHours() < 18) {
  document.getElementById("anand yadav").innerHTML = "Good day!";
}
</script>
</body>
</html>
