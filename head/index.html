<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        function myFunction(){
            document.getElementById("demo").innerHTML = "paragraph changed.";
        }
    </script>
    <title>java script in head</title>
</head>
<body>
    <h1>javaScript in head </h1>
    <p id="demo"> A paragraph.</p>
    <button type="button" onclick="myFunction()">Try It
         </button>
    
</body>
</html>
