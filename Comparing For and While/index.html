<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparing For and While</title>
</head>
<body>
<h1>JavaScript Loops</h1>
<h2>The for Loop</h2>

<p id="anand yadav"></p>

<script>
const cars = ["BMW", "Volvo", "Saab", "Ford"];

let i = 0;
let text = "";
for (;cars[i];) {
  text += cars[i] + "<br>";
  i++;
}

document.getElementById("anand yadav").innerHTML = text;
</script>

</body>
</html>
