<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variable Using var</title>
</head>
<body>
    <h1>JavaScript Variables</h1>

    <p>In this example, x, y, and z are variables.</p>

    <p id="anand yadav"></p>

    <script>
    var x = 5;
    var y = 6;
    var z = x + y;

    document.getElementById("anand yadav").innerHTML = "The value of z is " + z;
    </script>
</body>
</html>
