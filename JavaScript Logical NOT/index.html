<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Logical NOT</title>
</head>
<body>
<h1>JavaScript Logical Operators</h1>
<h2>The ! (NOT) Operator</h2>

<p id="anand yadav"></p>
<p id="ankit yadav"></p>

<script>
document.getElementById("anand yadav").innerHTML = (5 == 8);
document.getElementById("ankit yadav").innerHTML = !(5 == 8);
</script>
</body>
</html>
