<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constant Objects</title>
</head>
<body>
    <h2>JavaScript const</h2>

    <p>Declaring a constant object does NOT make the objects properties unchangeable:</p>

    <p id="anand yadav"></p>

    <script>
    // Create an object:
    const car = {type:"Fiat", model:"500", color:"white"};

    // Change a property:
    car.color = "red";

    // Add a property:
    car.owner = "anand yadav";

    // Display the property:
    document.getElementById("anand yadav").innerHTML = "Car owner is " + car.owner; 
    </script>
</body>
</html>
