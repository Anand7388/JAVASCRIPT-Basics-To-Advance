<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The ||= Operator</title>
</head>
<body>
<h1>JavaScript Assignments</h1>
<h2>Logical OR Assignment</h2>
<h3>The ||= Operator</h3>

<p>If the first value is false, the second value is assigned:</p>

<p id="anand yadav"></p>

<script>
let x = false;
let y = x ||= 10;

document.getElementById("anand yadav").innerHTML =  + y;
</script>
</body>
</html>
