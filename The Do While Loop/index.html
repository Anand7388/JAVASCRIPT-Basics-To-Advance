<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Do While Loop</title>
</head>
<body>
<h1>JavaScript Loops</h1>
<h2>The do...while Loop</h2>

<p id="anand yadav"></p>

<script>
let text = ""
let i = 0;

do {
  text += "<br>The number is " + i;
  i++;
}
while (i < 10);  

document.getElementById("anand yadav").innerHTML = text;
</script>

</body>
</html>
