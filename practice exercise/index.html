<!DOCTYPE html>
<html lang="en">
<head>

    <title>practice exercise </title>
</head>
<body>
    <h1>practice exercise </h1>
    <p>this is a simple practice exercise for break and continue statements.</p>

    Q1. Create an array of numbers [5, 6]. Add 4 at the beginning and 7 at the end of the array.

    <script>
        let arr = [5, 6];
        arr.unshift(4);  // add 4 at the beginning of the array 
        arr.push(7);   // add 7 at the end of the array 
        console.log(arr);  // this will print [4, 5, 6, 7]

    </script>
    
</body>
</html>
