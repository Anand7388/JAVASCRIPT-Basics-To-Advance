<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The else if Statement</title>
</head>
<body>
    
<h1>JavaScript if .. else</h1>

<p>A time-based greeting:</p>

<p id="ankit yadav"></p>

<script>
const time = new Date().getHours();
let greeting;
if (time < 10) {
  greeting = "anand yadav";
} else if (time < 20) {
  greeting = "ankit yadav";
} else {
  greeting = "akansha yadav";
}
document.getElementById("ankit yadav").innerHTML = greeting;
</script>

</body>
</html>
