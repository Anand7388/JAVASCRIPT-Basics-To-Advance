<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redeclaring Variables</title>
</head>
<body>
    <h2>Redeclaring a Variable Using var</h2>

    <p id="anand yadav"></p>

    <script>
    var  x = 10;
    // Here x is 10

    {  
    var x = 200;
    // Here x is 200
    }

    // Here x is 200
    document.getElementById("anand yadav").innerHTML = x;
    </script>
</body>
</html>
