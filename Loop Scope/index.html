<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Using var in a loop</title>
</head>
<body>
<h1>JavaScript Scope</h1>
<h2>Loop Scope</h2>

<p id="anand yadav"></p>

<script>
var i = 5;

for (var i = 0; i < 10; i++) {
  // some statements
}

document.getElementById("anand yadav").innerHTML = i;
</script>
</body>
</html>
