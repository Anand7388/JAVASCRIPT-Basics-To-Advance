<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Arithmetic</title>
</head>
<body>
    <h1>JavaScript Variables</h1>

    <p>The result of adding 5 + 2 + 3 is:</p>

    <p id="anand yadav"></p>

    <script>
    let x = 5 + 2 + 3;

    document.getElementById("anand yadav").innerHTML = x;
    </script>
</body>
</html>
