<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested if</title>
</head>
<body>
<h1>JavaScript Nested if</h1>

<p id="anand yadav"></p>

<script>
let age = 16;
let country = "USA";
let text = "You can Not drive!";

if (country == "USA") {
  if (age >= 16) {
    text = "You can drive!";
  }
}

document.getElementById("anand yadav").innerHTML = text;
</script>

</body>
</html>
